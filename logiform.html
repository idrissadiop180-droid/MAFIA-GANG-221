<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:320px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.profile-img{
    width:100px;
    height:100px;
    border-radius:50%;
    margin-bottom:15px;
    object-fit:cover;
    border:3px solid #007bff;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="login-box">

    <img src="https://via.placeholder.com/100"
         alt="Photo de profil"
         class="profile-img">

    <h2>Connexion</h2>

    <form action="welcom.html" method="get">

        <input
        type="text"
        name="username"
        placeholder="Nom d'utilisateur"
        required>

        <input
        type="password"
        name="password"
        placeholder="Mot de passe"
        required>

        <button type="submit">
            Se connecter
        </button>

    </form>

</div>

</body>
</html>
